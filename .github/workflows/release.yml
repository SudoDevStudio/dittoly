# Releases and the server image, ghcr.io/sudodevstudio/dittoly, that compose.server.yml runs (docs/server.md).
#
# Every merge to main that changes more than docs is a release. The merged pull request's label picks the version:
#   release:major  1.0.0 → 2.0.0        release:minor  0.1.0 → 0.2.0
#   release:skip   no release           (no label)     0.1.0 → 0.1.1
# The first release, with no v* tag yet, is the version in package.json. The version lives only in the Git tag and
# the image: package.json in the repository is not changed.
#
# Nothing is published untested. The image is built once, for linux/amd64 and linux/arm64, and pushed as
# :candidate-<commit>; that exact image is then started with compose.server.yml and checked
# (.github/scripts/smoke-server.sh). Only when it passes does the same image — same digest, not a rebuild — get
# :<version>, :<major>.<minor> and :latest, a signed attestation, and a Git tag with a GitHub release whose notes list
# the merged pull requests. Anyone can check the signature:
#   gh attestation verify oci://ghcr.io/sudodevstudio/dittoly:<version> --repo SudoDevStudio/dittoly
#
# A pull request that changes the image or how it runs gets the same check on an image it builds without pushing.
name: Release

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - 'site/**'
      - '**.md'
      - '.github/ISSUE_TEMPLATE/**'
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump for a release by hand'
        type: choice
        options: [patch, minor, major]
        default: patch
  pull_request:
    paths:
      - Dockerfile
      - compose.server.yml
      - .env.example
      - package-lock.json
      - .github/workflows/release.yml
      - .github/scripts/smoke-server.sh

permissions:
  contents: read

env:
  # Image names must be lower case (the owner is SudoDevStudio); compose.server.yml pulls this name.
  IMAGE: ghcr.io/sudodevstudio/dittoly

jobs:
  # ---------------------------------------------------------------------------------------- pull requests
  check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: release-check-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build the image (not pushed)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: ${{ env.IMAGE }}:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Start compose.server.yml with it and check it
        run: .github/scripts/smoke-server.sh ci

  # ---------------------------------------------------------------------------------------- releases
  release:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    # One release at a time, in merge order: two merges must not both claim the same version.
    concurrency:
      group: release-main
      cancel-in-progress: false
    permissions:
      contents: write # the tag and the GitHub release
      packages: write # push to ghcr.io
      pull-requests: read # the merged pull request's labels
      id-token: write # sign the attestation
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the tags, to find the last version

      - name: Decide the version
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
          EVENT: ${{ github.event_name }}
          BUMP_INPUT: ${{ inputs.bump }}
        run: |
          if [ "$EVENT" = workflow_dispatch ]; then
            bump="$BUMP_INPUT"; source="run by hand"
          else
            labels=$(gh api "repos/$GITHUB_REPOSITORY/commits/$SHA/pulls" --jq '[.[0].labels[]?.name] | join(" ")' 2>/dev/null || true)
            pr=$(gh api "repos/$GITHUB_REPOSITORY/commits/$SHA/pulls" --jq '.[0].number // empty' 2>/dev/null || true)
            source="${pr:+pull request #$pr}"; source="${source:-a direct push}"
            case " $labels " in
              *" release:skip "*) echo "skip=true" >> "$GITHUB_OUTPUT"; echo "No release: $source is labelled release:skip."; exit 0 ;;
              *" release:major "*) bump=major ;;
              *" release:minor "*) bump=minor ;;
              *) bump=patch ;;
            esac
          fi
          last=$(git tag -l 'v*' --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1 || true)
          if [ -z "$last" ]; then
            # The first release is what package.json says it is.
            version=$(node -p 'require("./package.json").version'); why="first release (package.json)"
          else
            IFS=. read -r major minor patch <<< "${last#v}"
            case "$bump" in
              major) version="$((major + 1)).0.0" ;;
              minor) version="$major.$((minor + 1)).0" ;;
              *)     version="$major.$minor.$((patch + 1))" ;;
            esac
            why="$bump after $last"
          fi
          if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            echo "::error::v$version already exists"; exit 1
          fi
          echo "Releasing v$version — $why, from $source."
          {
            echo "skip=false"
            echo "version=$version"
            echo "minor=${version%.*}"
            echo "candidate=candidate-${SHA::12}"
          } >> "$GITHUB_OUTPUT"

      - if: steps.plan.outputs.skip != 'true'
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - if: steps.plan.outputs.skip != 'true'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - if: steps.plan.outputs.skip != 'true'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build once and push as a candidate
        id: build
        if: steps.plan.outputs.skip != 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.IMAGE }}:${{ steps.plan.outputs.candidate }}
          build-args: VERSION=${{ steps.plan.outputs.version }}
          labels: |
            org.opencontainers.image.title=Dittoly
            org.opencontainers.image.description=Self-hosted orchestration: AI drafts the Flow, a person approves it, the engine runs exactly that version.
            org.opencontainers.image.licenses=Apache-2.0
            org.opencontainers.image.version=${{ steps.plan.outputs.version }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          # What is inside (SBOM) and how it was built (provenance), attached to the image itself.
          sbom: true
          provenance: mode=max
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start that exact image with compose.server.yml and check it
        if: steps.plan.outputs.skip != 'true'
        run: .github/scripts/smoke-server.sh "${{ steps.plan.outputs.candidate }}"

      - name: Promote the tested image to its version (same digest, no rebuild)
        if: steps.plan.outputs.skip != 'true'
        env:
          VERSION: ${{ steps.plan.outputs.version }}
          MINOR: ${{ steps.plan.outputs.minor }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          docker buildx imagetools create \
            -t "$IMAGE:$VERSION" -t "$IMAGE:$MINOR" -t "$IMAGE:latest" \
            "$IMAGE@$DIGEST"

      - if: steps.plan.outputs.skip != 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Tag and publish the GitHub release
        if: steps.plan.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.plan.outputs.version }}
          DIGEST: ${{ steps.build.outputs.digest }}
          SHA: ${{ github.sha }}
        run: |
          cat > notes-head.md <<NOTES
          **Server image:** \`$IMAGE:$VERSION\` (linux/amd64, linux/arm64) · digest \`$DIGEST\`
          Started with \`compose.server.yml\` and checked before it was published. To run it, set \`DITTOLY_VERSION=$VERSION\` in \`.env\` — [docs/server.md](https://github.com/$GITHUB_REPOSITORY/blob/v$VERSION/docs/server.md).
          Verify: \`gh attestation verify oci://$IMAGE:$VERSION --repo $GITHUB_REPOSITORY\`

          NOTES
          # --notes is put in front of the notes GitHub generates from the merged pull requests.
          gh release create "v$VERSION" --target "$SHA" --title "Dittoly $VERSION" --generate-notes --notes "$(cat notes-head.md)"
          {
            echo "### Released v$VERSION"
            echo
            echo "\`$IMAGE:$VERSION\` · \`$DIGEST\`"
            echo
            echo "If this is the first image, make the package public once: Packages → dittoly → Package settings."
          } >> "$GITHUB_STEP_SUMMARY"
